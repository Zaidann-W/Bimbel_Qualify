<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="/__dash.html" style="width:390px;height:6000px;border:0"></iframe>
<pre id="__diag">pending</pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  var w = document.getElementById('f').contentWindow;
  var d = w.document;
  var vw = d.documentElement.clientWidth;
  var out = [];
  d.querySelectorAll('*').forEach(function(el){
    var r = el.getBoundingClientRect();
    if (r.right > vw + 1 || r.left < -1) {
      out.push({t: el.tagName, c: (el.className||'').toString().slice(0,80), l: Math.round(r.left), r: Math.round(r.right), txt: (el.textContent||'').replace(/\s+/g,' ').trim().slice(0,35)});
    }
  });
  document.getElementById('__diag').textContent =
    'SCROLLW=' + d.documentElement.scrollWidth + ' BODYW=' + d.body.scrollWidth + ' VW=' + vw + '\n' +
    out.slice(0,30).map(function(o){return JSON.stringify(o)}).join('\n');
});
</script></body></html>
